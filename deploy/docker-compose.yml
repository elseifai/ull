# CMS + API + Admissions Desk on one EC2 instance. CloudFront routes /api/* and /admin* here.
services:
  cms:
    build: ../cms
    restart: unless-stopped
    env_file: ../cms/.env
    environment:
      DATABASE_URL: postgres://ull:${POSTGRES_PASSWORD}@db:5432/ull_cms
    ports:
      - "3000:3000"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ull
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ull_cms
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
